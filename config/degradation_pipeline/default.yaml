_target_: absolute_degradation.distortions.degradation_pipeline.DegradationPipeline

probabilities: [0.3, 0.35, 0.35]

scratch_generator:
  _target_: absolute_degradation.scratches.FilmScratchGenerator
  seed: ${seed}
  config:
    _target_: absolute_degradation.scratches.film_scratch_generator.ScratchConfig
    probability: 0.3
    count_range: [1, 5]
    width_range_microns: [5.0, 40.0]
    scan_resolution_dpi: 2000
    intensity_range: [0.2, 1.0]
    weave_freq_hz: 2.0
    weave_amplitude_pixels: 2.0
    flicker_freq_hz: 12.0
    prob_curved: 0.2
    lifespan_range: [2, 10]
    spawn_probability: 0.3
    prob_white: 0.6

defaults:
  - light_steps: default
  - medium_steps: default
  - heavy_steps: default
