_target_: absolute_degradation.distortions.steps.ComposeDistortStep

distortions:
  - _target_: absolute_degradation.distortions.steps.CropStep
    crop_h: ${crop_h}
    crop_w: ${crop_w}

  - ${artifacts_common}
  - ${negative_film_distortions}
  - _target_: absolute_degradation.distortions.steps.ComposeDistortStep
    permute: true

    distortions:
      - _target_: absolute_degradation.distortions.steps.FixedBlurDistortStep
        kernel_size_bounds: [1, 7]

      - _target_: absolute_degradation.distortions.steps.FilmGrainStep
        noise_std_bounds:
          - ${div:8, 255}
          - ${div:10, 255}
        iso_range: [0.04, 0.1]
        grain_size_range: [1.0, 1.4]
        scanner_noise_sigma_range: [0.01, 0.02]

      - _target_: absolute_degradation.distortions.steps.JpegStep
        quality_center_bounds: [40, 70]

      - _target_: absolute_degradation.distortions.steps.DownsampleStep
        down_scale_factor_bounds: [0.3, 0.8]
        up_scale_factor_bounds: [1, 2]

      - _target_: absolute_degradation.distortions.steps.GammaCorrectionStep

      - _target_: absolute_degradation.distortions.steps.XAxisMotionStep
        padding: ${x_motion_padding}
        sigma_bounds: [0, 1.5]

      - _target_: absolute_degradation.distortions.steps.YAxisMotionStep
        padding: ${y_motion_padding}
        sigma_bounds: [0, 20]


  - ${pipeline_tail[0]}
  - ${pipeline_tail[1]}
  - ${pipeline_tail[2]}
  - ${pipeline_tail[3]}
