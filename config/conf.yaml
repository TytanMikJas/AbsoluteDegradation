seed: 42
crop_size: 256
y_motion_padding: 15
x_motion_padding: 5
# crop = crop_size + 2 * padding (motion steps remove padding from each side)
crop_h: ${sum:${crop_size}, ${mul:${y_motion_padding}, 2}}
crop_w: ${sum:${crop_size}, ${mul:${x_motion_padding}, 2}}
valid_extensions:
  - .png
  - .jpg

input_path: ./data/input
output_path: ./data/output
texture_path: ./data/textures

artifacts_common:
  _target_: absolute_degradation.distortions.steps.ArtifactsDistortStep
  texture_root: ${texture_path}
  moving_lines_root: ${texture_path}
  min_textures_per_frame: 1
  max_textures_per_frame: 3
  moving_line_probability: 0.3
  lock_blending_mode_per_frame: true
  texture_durations: [1, 3, 5]
  texture_probs: [0.95, 0.04, 0.01]


negative_film_distortions:
  _target_: absolute_degradation.distortions.steps.ComposeNegativeStep
  permute: true
  probability: 0.5
  distortions:
    - _target_: absolute_degradation.distortions.steps.FixedBlurDistortStep
      kernel_size_bounds: [0, 2]
      weight_anisotropic: 0.5 # smaller as it could be doubled
      weight_isotropic: 0.5  # smaller as it could be doubled

    - _target_: absolute_degradation.distortions.steps.FilmGrainStep
      noise_std_bounds:
        - ${div:5, 255}
        - ${div:6, 255}
      iso_range: [0.01, 0.05]
      grain_size_range: [1.0, 1.3]
      scanner_noise_sigma_range: [0.001, 0.005] # half of the original

    - _target_: absolute_degradation.distortions.steps.DownsampleStep
      down_scale_factor_bounds: [0.9, 1]
      up_scale_factor_bounds: [1, 1.1]

    - _target_: absolute_degradation.distortions.steps.GammaCorrectionStep
      log_std: ${div:1, 12} # smaller as it would be doubled


pipeline_tail:
  - _target_: absolute_degradation.distortions.steps.SizeMatchingStep
  - _target_: absolute_degradation.distortions.steps.ColorJitterStep
    probability: 0.5
    seed: ${seed}
  - _target_: absolute_degradation.distortions.steps.GroundTruthSharpenStep
  - _target_: absolute_degradation.distortions.steps.QuantizationStep
    output_type: 'int'

defaults:
  - degradation_pipeline: default
